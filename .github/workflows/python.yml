# This repository only: the Python side of the plugin (its helpers talk to Wyze through wyze-sdk),
# besides the shared ci.yml (which runs the tests with Ubuntu's Python 3.12).
name: Python

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays: catches breakage from new wyze-sdk releases

permissions:
  contents: read

jobs:
  # In Debian with Python 3.9, the version Raspberry Pi OS 11 has (GitHub's own Ubuntu machines
  # no longer offer it).
  plugin-python39:
    name: Plugin tests on Python 3.9 (as on the Pi)
    runs-on: ubuntu-latest
    container: python:3.9-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1       # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1     # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run test:matrix
        env:
          PYTHON: python3

  wyze-sdk:
    name: Real wyze-sdk ${{ matrix.label }}
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-bookworm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: '2.2.0 (Python 3.9, as on the Pi)', python: '3.9', sdk: '==2.2.0' }
          - { label: 'latest (Python 3.12)', python: '3.12', sdk: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1       # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --no-cache-dir "wyze-sdk${{ matrix.sdk }}"
      - run: python3 test/sdk_contract.py
